<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d"><title>인과 지도</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="인과 지도">
<style>/* 디자인 토큰: 간격 4/8/12/16 · 반경 --r(12)/pill · 그림자 1종 · 글자 11/13/15/19 */
:root{--bg:#0a0b0d;--panel:rgba(20,21,24,.92);--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#e2e3e5;--mu:#8c8e94;--acc:#e6e8ec;--accbg:rgba(255,255,255,.1);--accln:rgba(255,255,255,.32);
--r:10px;--pill:10px;--sh:0 4px 16px rgba(0,0,0,.5),0 0 12px rgba(255,255,255,.1);
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--f1:11px;--f2:13px;--f3:15px;--f4:19px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 42%,#17181c 0%,#0e0f12 55%,#070708 100%);color:var(--tx);font-family:-apple-system,"Pretendard","Noto Sans KR",system-ui,sans-serif;font-size:var(--f2);overflow:hidden;overscroll-behavior:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#hud i{position:absolute;width:18px;height:18px;border:1px solid rgba(255,255,255,.32)}
#hud .a{left:8px;top:calc(env(safe-area-inset-top) + 68px);border-right:0;border-bottom:0}#hud .b{right:8px;top:calc(env(safe-area-inset-top) + 68px);border-left:0;border-bottom:0}
#hud .c{left:8px;bottom:8px;border-right:0;border-top:0}#hud .d{right:8px;bottom:8px;border-left:0;border-top:0}
#ro{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 74px);font:10px/1.35 ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.5);letter-spacing:.08em;text-align:right;white-space:pre;pointer-events:none;z-index:4}
canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;display:block}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accln);outline-offset:2px}
/* 상단 검색 + FAB */
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + var(--s3)) var(--s3) 0;display:flex;gap:var(--s2);z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
#sw{flex:1;position:relative}
#q{width:100%;height:44px;border-radius:var(--pill);border:1px solid var(--line);background:rgba(22,23,26,.74);box-shadow:var(--sh);color:var(--tx);padding:0 var(--s4) 0 40px;font-size:16px;outline:none;backdrop-filter:blur(12px);transition:border-color .15s}
#q:focus{border-color:var(--accln)}
#q:focus-visible{outline:none}
#sw::before{content:"⌕";position:absolute;left:var(--s4);top:10px;color:var(--mu);font-size:19px;z-index:1;pointer-events:none}
#sug{position:absolute;left:0;right:0;top:52px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:none;max-height:50vh;overflow-y:auto}
#sug div{min-height:48px;display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);border-bottom:1px solid var(--line);font-size:var(--f3)}
#sug div:last-child{border-bottom:0}
#sug div:active{background:var(--card)}
.fab{width:44px;height:44px;border-radius:var(--pill);border:1px solid var(--line);background:rgba(22,23,26,.74);box-shadow:var(--sh);color:var(--tx);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(12px);transition:background .15s,border-color .15s}
.fab:hover{border-color:var(--accln)}
.fab:active{background:var(--accbg)}
/* 줌 박스 */
#zoombox{position:fixed;right:var(--s3);bottom:calc(env(safe-area-inset-bottom) + var(--s4));display:flex;flex-direction:column;gap:0;z-index:4;transition:bottom .25s;background:rgba(22,23,26,.74);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:0;overflow:hidden}
#zoombox .fab{background:transparent;border:0;box-shadow:none;width:44px;height:44px;border-radius:0;font-size:20px;backdrop-filter:none}
#zoombox .fab+.fab{border-top:1px solid var(--line)}
#zoombox .fab:hover{background:rgba(255,255,255,.06)}
#zoombox .fab:active{background:var(--accbg)}
#zc{position:fixed;left:var(--s3);bottom:calc(env(safe-area-inset-bottom) + 56px);z-index:4}
#stat:empty{display:none}
#stat{position:fixed;left:var(--s3);bottom:calc(env(safe-area-inset-bottom) + var(--s4));font-size:var(--f1);color:var(--mu);z-index:4;pointer-events:none;background:rgba(22,23,26,.6);font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;color:rgba(255,255,255,.55);padding:var(--s1) var(--s2);border-radius:var(--pill)}
/* 시트 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-radius:var(--r) var(--r) 0 0;border-top:1px solid var(--line);
 box-shadow:var(--sh);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top-color:rgba(255,255,255,.22);transform:translateY(105%);transition:transform .25s ease;max-height:78vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.peek{transform:translateY(calc(100% - 132px - env(safe-area-inset-bottom)))}
.sheet.open{transform:translateY(0)}
.sheet.half{transform:translateY(calc(100% - 50vh))}
#ns{height:78vh}
.hd{padding:var(--s3) var(--s4) var(--s1);touch-action:none;cursor:grab}
.hd i{display:block;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:0 auto var(--s3)}
.bd{overflow-y:auto;padding:0 var(--s4) var(--s4);-webkit-overflow-scrolling:touch}
h2{margin:0;font-size:var(--f4);font-weight:600;display:flex;align-items:center;gap:var(--s2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.sub{color:var(--mu);font-size:var(--f2);margin-top:var(--s1)}
#nsh{position:relative}#nt{padding-right:132px}#nbtns{position:absolute;right:var(--s3);top:var(--s2);display:flex;gap:var(--s1)}#nbtns .chip{padding:0 var(--s3);font-size:var(--f2)}#nclose{width:44px;padding:0;font-size:var(--f3)}
#fbadge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#0b1d24;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}#fb{position:relative}
#freset{margin-left:auto;font-size:var(--f2);color:var(--acc)}
/* 탭·칩 */
.tabs{display:flex;gap:var(--s2);margin:var(--s3) 0 var(--s2);overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button,.chip{min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:var(--pill);padding:var(--s2) var(--s3);font-size:var(--f2);line-height:1.2;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.tabs button:active,.chip:active{background:rgba(255,255,255,.18)}
.tabs button.on,.chip.on{background:var(--accbg);border-color:var(--accln);color:var(--acc);font-weight:600}
.chip{--stripe:transparent}
.chip[style*="--stripe"]::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--stripe);margin-right:var(--s2);vertical-align:0}
.row{display:flex;flex-wrap:wrap;gap:var(--s2)}
/* 목록 */
.it{padding:var(--s3) var(--s1);border-bottom:1px solid var(--line)}
.it .r1{display:flex;align-items:center;gap:var(--s2);font-size:var(--f3)}
.g{font-size:var(--f1);font-weight:700;border-radius:var(--s1);padding:1px 6px;flex:none}
.sg{font-weight:700;width:14px;text-align:center;flex:none}
.nm{flex:1;color:var(--tx);text-decoration:none}
.go{color:var(--acc);font-size:var(--f2);flex:none;padding:var(--s3);margin:calc(-1 * var(--s3)) calc(-1 * var(--s2)) calc(-1 * var(--s3)) 0;cursor:pointer}
.more{width:100%;margin-top:var(--s2);justify-content:center}
.meta{font-size:var(--f2);color:var(--mu);margin-top:var(--s1);padding-left:22px}
.note{font-size:var(--f2);color:#b4b6bb;margin-top:var(--s2);padding-left:22px;display:none;line-height:1.5}
.it.x .note{display:block}
.sec{font-size:var(--f1);font-weight:600;color:var(--mu);margin:var(--s4) 0 var(--s2);padding-top:var(--s4);border-top:1px solid var(--line);letter-spacing:.06em}
.sec b{color:var(--tx);font-weight:600;margin-left:var(--s1);letter-spacing:0}
#fbd>.sec:first-child{border-top:0;padding-top:0;margin-top:var(--s2)}
.fl{overflow-x:auto;margin:var(--s1) -6px 0;padding-bottom:6px}.fl svg{display:block}.fl g.bx{cursor:pointer}
.fl .tr-dim{opacity:.18}.fl path.tr-on{stroke-opacity:1;stroke-width:3.2}.fl g.bx.tr-on rect{stroke-width:2.2;stroke:#fff}
.flh{font-size:var(--f1);color:var(--mu);display:flex;justify-content:space-between;padding:0 var(--s1);margin-top:var(--s2)}
.lg{display:flex;flex-wrap:wrap;gap:var(--s3);font-size:var(--f1);color:var(--mu)}
.lg span{display:flex;align-items:center;gap:var(--s1)}
.sw{display:inline-block;width:20px;height:0;border-top:2px solid}
/* 슬라이더 */
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:44px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--acc) var(--p,0%),rgba(255,255,255,.18) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:#e8eaed;border:2px solid var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]:active::-webkit-slider-thumb{background:var(--acc)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#e8eaed;border:2px solid var(--bg)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%);background:#ececee;color:#1c1c1e;padding:var(--s2) var(--s4);border-radius:var(--pill);font-size:var(--f2);opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
#fstat{border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:var(--s3);margin-bottom:var(--s2)}
#fstat .frow{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);font-size:var(--f2);line-height:1.9}
#fstat .frow .k{color:var(--mu)}
#fstat .frow .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;color:#e8eaed}
#fstat .frow .v b{font-weight:600}
#fstat .fbar{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;margin:var(--s2) 0 var(--s1)}
#fstat .fbar i{display:block;height:100%}
#fstat .fnote{font-size:var(--f1);color:var(--mu);line-height:1.5;margin-top:var(--s1)}
/* 2D 포커스 인과 흐름 맵 (모바일 우선 기본 뷰, 3D는 #mode3d 토글) */
body:not(.mode-3d) #cv,body:not(.mode-3d) #hud,body:not(.mode-3d) #ro,body:not(.mode-3d) #zoombox,body:not(.mode-3d) #zc,body:not(.mode-3d) #stat{display:none!important}
body.mode-3d #f2d,body.ind-on #f2d{display:none!important}
#f2d{position:fixed;inset:0;z-index:2;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 64px) 12px calc(env(safe-area-inset-bottom) + 32px)}
#f2d>*{max-width:1180px;margin-left:auto;margin-right:auto}
.f2-brief{background:rgba(19,22,30,.9);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(10px)}
.f2-btop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.f2-regime{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,194,71,.15);border:1px solid rgba(255,194,71,.45);color:#fde68a}
.f2-regime.stress{background:rgba(255,95,109,.16);border-color:rgba(255,95,109,.5);color:#fda4af}
.f2-regime.calm{background:rgba(53,224,161,.14);border-color:rgba(53,224,161,.45);color:#6ee7b7}
.f2-regime small{opacity:.78;font-weight:500;font-size:11px}
.f2-bmeta{font-size:11px;color:#8e97ab;font-family:ui-monospace,Menlo,Consolas,monospace}
.f2-strip-row{display:flex;align-items:center;gap:7px;min-width:0}
.f2-slabel{flex:none;font-size:11px;font-weight:800;color:#8e97ab;width:28px;letter-spacing:.02em}
.f2-chips{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;flex:1}
.f2-chips::-webkit-scrollbar{display:none}
.f2-mchip{flex:none;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#e6ebf4;font-size:12px;cursor:pointer;white-space:nowrap}
.f2-mchip b{font-weight:700}
.f2-mchip span{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:700}
.f2-mchip.down{border-color:rgba(96,165,250,.45);background:rgba(59,130,246,.14)}
.f2-mchip.down span{color:#93c5fd}
.f2-mchip.up{border-color:rgba(248,113,113,.45);background:rgba(239,68,68,.14)}
.f2-mchip.up span{color:#fca5a5}
.f2-mchip.on,.f2-qchip.on{border-color:#fff;background:rgba(255,255,255,.18);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.f2-qchip{flex:none;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--qc,#8a9bb0) 40%,rgba(255,255,255,.12));background:rgba(24,27,36,.88);color:#dce2ee;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.f2-qdot{width:7px;height:7px;border-radius:50%;background:var(--qc,#8a9bb0);flex:none}
.f2-trail{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px;padding:0 2px}
.f2-trail::-webkit-scrollbar{display:none}
.f2-titem{flex:none;border:0;background:rgba(255,255,255,.06);color:#9ea7ba;font-size:11.5px;padding:3px 9px;border-radius:999px;cursor:pointer;white-space:nowrap}
.f2-titem.cur{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.f2-tsep{color:#5e6678;font-style:normal;font-size:12px;flex:none}
/* 2D 인과 흐름 본문: 모바일은 선택 노드를 최상단에 고정해 바로 확인, 데스크톱은 가로 3열(원인 → 선택노드 → 결과) */
.f2-flow{display:flex;flex-direction:column;gap:10px}
.f2-conn{display:none}
.f2-center{order:1}
.f2-in{order:2}
.f2-out{order:3}
.f2-carr{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#c7d0e0;font-size:14px;font-weight:800}
.f2-center{background:linear-gradient(180deg,color-mix(in srgb,var(--fc,#4da3ff) 18%,#161923),#131620);border:1.5px solid color-mix(in srgb,var(--fc,#4da3ff) 65%,rgba(255,255,255,.2));border-radius:16px;padding:14px 15px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.f2-ftags{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.f2-fsec{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#e5eaf3}
.f2-fsec i{width:8px;height:8px;border-radius:50%;display:inline-block}
.f2-ftier{font-size:11px;color:#9ea8bc;background:rgba(255,255,255,.08);padding:2px 7px;border-radius:6px}
.f2-fstat{margin-left:auto;font-size:11.5px;color:#a5aec2;font-weight:600}
.f2-fname{margin:0;font-size:21px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.25}
.f2-fstate{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:#9ca5b9}
.f2-st{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(255,255,255,.08);color:#d7dde8}
.f2-st.up{background:rgba(239,68,68,.2);color:#fca5a5}
.f2-st.down{background:rgba(59,130,246,.2);color:#93c5fd}
.f2-fdesc{margin:8px 0 0;font-size:13px;line-height:1.55;color:#cbd2df}
.f2-fctrl{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.f2-cbtn{height:34px;padding:0 11px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#e6ebf4;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.f2-cbtn.on{background:rgba(122,162,247,.24);border-color:#7aa2f7;color:#fff}
.f2-cbtn.accent{background:rgba(255,194,71,.18);border-color:rgba(255,194,71,.6);color:#fde68a}
.f2-cbtn.icon{padding:0 10px}
.f2-weakbtn{width:100%;margin-top:8px;height:34px;border-radius:9px;border:1px dashed rgba(255,255,255,.22);background:transparent;color:#9fb4d8;font-size:12px;font-weight:600;cursor:pointer}
.f2-col{background:rgba(18,21,29,.84);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:11px 12px}
.f2-colhd{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.f2-badge-up{background:rgba(45,212,191,.18);border:1px solid rgba(45,212,191,.45);color:#5eead4;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.f2-badge-down{background:rgba(251,191,36,.18);border:1px solid rgba(251,191,36,.45);color:#fde68a;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.f2-colhd b{font-size:13px;color:#dfe5f0;font-weight:700}
.f2-colhd em{margin-left:auto;font-style:normal;font-size:11.5px;color:#939cb0;font-weight:700;background:rgba(255,255,255,.07);padding:1px 8px;border-radius:999px}
.f2-grid{display:grid;grid-template-columns:1fr;gap:7px}
.f2-ecard{text-align:left;width:100%;border:1px solid rgba(255,255,255,.12);border-left:3.5px solid var(--ec,#8a9bb0);background:rgba(27,31,42,.92);border-radius:10px;padding:9px 11px;color:#e8edf5;cursor:pointer;transition:border-color .14s,background .14s}
.f2-ecard:hover,.f2-ecard:active{border-color:rgba(255,255,255,.4);background:rgba(36,41,56,.98)}
.f2-ectop{display:flex;align-items:center;gap:6px}
.f2-sgn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:13px;font-weight:900;flex:none;background:rgba(255,255,255,.08);color:#d7dde8}
.f2-sgn.pos{background:rgba(53,224,161,.2);color:#6ee7b7}
.f2-sgn.neg{background:rgba(255,95,109,.2);color:#fda4af}
