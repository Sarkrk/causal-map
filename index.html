<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7"><title>인과 지도</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="인과 지도">
<style>/* 클린 핀테크 라이트 테마 (플랫 문서형 · 중립 톤 + 절제된 색 점) */
:root{
  --bg:#f4f5f7;--panel:#ffffff;--card:#f2f4f6;--line:#e5e8eb;--line2:#d1d6db;
  --tx:#191f28;--tx2:#4e5968;--mu:#8b95a1;--acc:#3182f6;--accbg:#ebf3fe;--accln:#3182f6;
  --r:8px;--pill:8px;--sh:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --sh-lg:0 8px 24px rgba(16,24,40,.1);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--f1:11px;--f2:13px;--f3:15px;--f4:19px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:var(--f2);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#hud,#ro{display:none!important}
canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;display:block;background:var(--bg)}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
/* 상단 검색 + 액션 버튼 */
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) var(--s3) 8px;display:flex;gap:6px;z-index:5;background:rgba(244,245,247,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#sw{flex:1;position:relative}
#q{width:100%;height:40px;border-radius:var(--r);border:1px solid var(--line);background:#fff;color:var(--tx);padding:0 var(--s3) 0 34px;font-size:15px;outline:none;transition:border-color .15s}
#q::placeholder{color:var(--mu)}
#q:focus{border-color:var(--acc)}
#q:focus-visible{outline:none}
#sw::before{content:"⌕";position:absolute;left:11px;top:9px;color:var(--mu);font-size:17px;z-index:1;pointer-events:none}
#sug{position:absolute;left:0;right:0;top:46px;background:#fff;border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--sh-lg);overflow:hidden;display:none;max-height:50vh;overflow-y:auto}
#sug div{min-height:44px;display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);font-size:14px;color:var(--tx);cursor:pointer}
#sug div:last-child{border-bottom:0}
#sug div:hover,#sug div:active{background:var(--card)}
.fab{width:40px;height:40px;border-radius:var(--r);border:1px solid var(--line);background:#fff;color:var(--tx);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
.fab:hover{border-color:var(--line2);background:#fafbfc}
.fab:active{background:var(--card)}
.fab.on{background:var(--tx);border-color:var(--tx);color:#fff}
/* 3D 줌 박스 · 상태줄 */
#zoombox{position:fixed;right:var(--s3);bottom:calc(env(safe-area-inset-bottom) + var(--s4));display:flex;flex-direction:column;gap:0;z-index:4;transition:bottom .25s;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
#zoombox .fab{background:transparent;border:0;width:40px;height:40px;border-radius:0;font-size:18px}
#zoombox .fab+.fab{border-top:1px solid var(--line)}
#zoombox .fab:hover{background:var(--card)}
#zc{position:fixed;left:var(--s3);bottom:calc(env(safe-area-inset-bottom) + 52px);z-index:4;box-shadow:var(--sh)}
#stat:empty{display:none}
#stat{position:fixed;left:var(--s3);bottom:calc(env(safe-area-inset-bottom) + var(--s4));font-size:var(--f1);color:var(--tx2);z-index:4;pointer-events:none;background:#fff;border:1px solid var(--line);font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:6px}
/* 하단 상세·설정 시트 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-radius:12px 12px 0 0;border-top:1px solid var(--line2);box-shadow:0 -8px 28px rgba(16,24,40,.12);transform:translateY(105%);transition:transform .25s ease;max-height:80vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.peek{transform:translateY(calc(100% - 132px - env(safe-area-inset-bottom)))}
.sheet.open{transform:translateY(0)}
.sheet.half{transform:translateY(calc(100% - 50vh))}
#ns{height:80vh}
.hd{padding:var(--s3) var(--s4) var(--s2);touch-action:none;cursor:grab;border-bottom:1px solid var(--line)}
.hd i{display:block;width:36px;height:4px;border-radius:2px;background:#d1d6db;margin:0 auto var(--s2)}
.bd{overflow-y:auto;padding:var(--s3) var(--s4) var(--s4);-webkit-overflow-scrolling:touch}
h2{margin:0;font-size:18px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:var(--s2);letter-spacing:-.01em}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.sub{color:var(--mu);font-size:var(--f2);margin-top:3px}
.ndesc-t{color:var(--tx2);font-size:13px;line-height:1.55;margin-top:6px}
#nsh{position:relative}#nt{padding-right:116px}#nbtns{position:absolute;right:var(--s3);top:var(--s2);display:flex;gap:6px}#nbtns .chip{padding:0 10px;font-size:var(--f2);min-height:34px}#nclose{width:34px;padding:0;font-size:14px}
#fbadge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}#fb{position:relative}
#freset{margin-left:auto;font-size:var(--f2);color:var(--acc);min-height:32px}
/* 탭·칩 */
.tabs{display:flex;gap:6px;margin:0 0 var(--s2);overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button,.chip{min-height:36px;border:1px solid var(--line);background:#fff;color:var(--tx2);border-radius:var(--r);padding:6px 11px;font-size:12.5px;font-weight:600;line-height:1.2;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.tabs button:hover,.chip:hover{background:var(--card);color:var(--tx)}
.tabs button.on,.chip.on{background:var(--tx);border-color:var(--tx);color:#fff;font-weight:700}
.chip{--stripe:transparent}
.chip[style*="--stripe"]::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--stripe);margin-right:6px;vertical-align:0}
.row{display:flex;flex-wrap:wrap;gap:6px}
/* 목록 */
.it{padding:11px 4px;border-bottom:1px solid var(--line)}
.it .r1{display:flex;align-items:center;gap:var(--s2);font-size:14px}
.g{font-size:11px;font-weight:700;border-radius:5px;padding:2px 6px;flex:none}
.sg{font-weight:700;width:14px;text-align:center;flex:none;color:var(--tx2)}
.nm{flex:1;color:var(--tx);font-weight:600;text-decoration:none}
.go{color:var(--acc);font-size:12.5px;font-weight:600;flex:none;padding:8px 4px;margin:-8px 0;cursor:pointer}
.more{width:100%;margin-top:var(--s2);justify-content:center}
.meta{font-size:12px;color:var(--mu);margin-top:3px;padding-left:22px;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--tx2);margin-top:6px;padding-left:22px;display:none;line-height:1.5}
.it.x .note{display:block}
.sec{font-size:11.5px;font-weight:700;color:var(--mu);margin:var(--s4) 0 var(--s2);padding-top:var(--s3);border-top:1px solid var(--line);letter-spacing:.02em}
.sec b{color:var(--tx);font-weight:700;margin-left:var(--s1)}
#fbd>.sec:first-child{border-top:0;padding-top:0;margin-top:0}
.fl{overflow-x:auto;margin:var(--s1) -4px 0;padding-bottom:6px}.fl svg{display:block}.fl g.bx{cursor:pointer}
.fl .tr-dim{opacity:.2}.fl path.tr-on{stroke-opacity:1;stroke-width:2.8}.fl g.bx.tr-on rect{stroke-width:2;stroke:#191f28}
.flh{font-size:var(--f1);color:var(--mu);display:flex;justify-content:space-between;padding:0 var(--s1);margin-top:var(--s2)}
.lg{display:flex;flex-wrap:wrap;gap:var(--s3);font-size:var(--f1);color:var(--mu)}
.lg span{display:flex;align-items:center;gap:var(--s1)}
.sw{display:inline-block;width:20px;height:0;border-top:2px solid}
/* 슬라이더 */
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:38px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--acc) var(--p,0%),#d1d6db var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.18)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#d1d6db}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translateX(-50%);background:#191f28;color:#fff;padding:8px 14px;border-radius:var(--r);font-size:12.5px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;box-shadow:var(--sh-lg)}
#toast.on{opacity:1}
#fstat{border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);margin-bottom:var(--s2);background:#fafbfc}
#fstat .frow{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);font-size:12.5px;line-height:1.85}
#fstat .frow .k{color:var(--tx2)}
#fstat .frow .v{font-variant-numeric:tabular-nums;color:var(--tx)}
#fstat .frow .v b{font-weight:700}
#fstat .fbar{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;margin:var(--s2) 0 var(--s1)}
#fstat .fbar i{display:block;height:100%}
#fstat .fnote{font-size:var(--f1);color:var(--mu);line-height:1.5;margin-top:var(--s1)}

/* ─── 2D 포커스 인과 흐름 맵 (모바일 우선 기본 뷰) ─── */
body:not(.mode-3d) #cv,body:not(.mode-3d) #hud,body:not(.mode-3d) #ro,body:not(.mode-3d) #zoombox,body:not(.mode-3d) #zc,body:not(.mode-3d) #stat{display:none!important}
body.mode-3d #f2d,body.ind-on #f2d{display:none!important}
#f2d{position:fixed;inset:0;z-index:2;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 68px) 12px calc(env(safe-area-inset-bottom) + 32px);background:var(--bg)}
#f2d>*{max-width:1160px;margin-left:auto;margin-right:auto}
.f2-brief{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.f2-btop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.f2-regime{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:700;background:#fef3c7;color:#92400e}
.f2-regime.stress{background:#fee2e2;color:#b91c1c}
.f2-regime.calm{background:#dcfce7;color:#15803d}
.f2-regime small{opacity:.75;font-weight:500;font-size:11px}
.f2-bmeta{font-size:11.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.f2-strip-row{display:flex;align-items:center;gap:8px;min-width:0}
.f2-slabel{flex:none;font-size:11.5px;font-weight:700;color:var(--mu);width:26px}
.f2-chips{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;flex:1}
.f2-chips::-webkit-scrollbar{display:none}
.f2-mchip{flex:none;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--tx);font-size:12px;cursor:pointer;white-space:nowrap}
.f2-mchip b{font-weight:600}
.f2-mchip span{font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700}
.f2-mchip.down span{color:#2563eb}
.f2-mchip.up span{color:#d93848}
.f2-mchip:hover,.f2-qchip:hover{background:var(--card)}
.f2-mchip.on,.f2-qchip.on{border-color:var(--tx);background:var(--tx);color:#fff}
.f2-mchip.on span{color:#e5e8eb}
.f2-qchip{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--tx2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.f2-qdot{width:6px;height:6px;border-radius:50%;background:var(--qc,#8b95a1);flex:none}
.f2-trail{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px;padding:0 2px}
.f2-trail::-webkit-scrollbar{display:none}
.f2-titem{flex:none;border:1px solid var(--line);background:#fff;color:var(--tx2);font-size:11.5px;padding:3px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
.f2-titem.cur{background:var(--tx);border-color:var(--tx);color:#fff;font-weight:700}
.f2-tsep{color:var(--mu);font-style:normal;font-size:12px;flex:none}
/* 2D 인과 흐름: 모바일은 선택 노드 최상단, 데스크톱은 가로 3열(원인 → 선택노드 → 결과) */
.f2-flow{display:flex;flex-direction:column;gap:10px}
.f2-conn{display:none}
.f2-center{order:1;background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh)}
.f2-in{order:2}
.f2-out{order:3}
.f2-carr{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--line2);color:var(--tx2);font-size:13px;font-weight:700}
.f2-ftags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.f2-fsec{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--tx2)}
.f2-fsec i{width:7px;height:7px;border-radius:50%;display:inline-block}
.f2-ftier{font-size:11px;color:var(--tx2);background:var(--card);padding:2px 7px;border-radius:5px;font-weight:600}
.f2-fstat{margin-left:auto;font-size:11.5px;color:var(--mu);font-weight:600;font-variant-numeric:tabular-nums}
.f2-fname{margin:0;font-size:21px;font-weight:800;color:var(--tx);letter-spacing:-.02em;line-height:1.28}
.f2-fstate{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.f2-st{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--card);color:var(--tx2)}
.f2-st.up{background:#fee2e2;color:#b91c1c}
.f2-st.down{background:#dbeafe;color:#1d4ed8}
.f2-fdesc{margin:9px 0 0;font-size:13.5px;line-height:1.6;color:var(--tx2)}
.f2-fctrl{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.f2-cbtn{height:34px;padding:0 11px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--tx);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.f2-cbtn:hover{background:var(--card)}
.f2-cbtn.on{background:var(--tx);border-color:var(--tx);color:#fff}
.f2-cbtn.accent{background:var(--acc);border-color:var(--acc);color:#fff}
.f2-cbtn.accent:hover{background:#1b64da}
.f2-cbtn.icon{padding:0 10px}
.f2-weakbtn{width:100%;margin-top:9px;height:34px;border-radius:6px;border:1px dashed var(--line2);background:#fafbfc;color:var(--tx2);font-size:12px;font-weight:600;cursor:pointer}
.f2-col{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.f2-colhd{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.f2-badge-up{background:#ecfdf5;color:#047857;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
.f2-badge-down{background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
.f2-colhd b{font-size:13px;color:var(--tx);font-weight:700}
.f2-colhd em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--mu);font-weight:700;background:var(--card);padding:1px 7px;border-radius:5px;font-variant-numeric:tabular-nums}
.f2-grid{display:grid;grid-template-columns:1fr;gap:6px}
.f2-ecard{text-align:left;width:100%;border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 11px;color:var(--tx);cursor:pointer;transition:border-color .12s,background .12s}
.f2-ecard:hover,.f2-ecard:active{border-color:var(--line2);background:#fafbfc}
.f2-ectop{display:flex;align-items:center;gap:7px}
.f2-sgn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;font-size:12.5px;font-weight:800;flex:none;background:var(--card);color:var(--tx2)}
.f2-sgn.pos{background:#ecfdf5;color:#047857}
.f2-sgn.neg{background:#fef2f2;color:#b91c1c}
.f2-sgn.mix{background:#fef3c7;color:#92400e}
.f2-ename{font-size:14px;font-weight:700;color:var(--tx);flex:1;min-width:0;line-height:1.25}
.f2-elv{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;flex:none}
.f2-ecmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:4px;padding-left:27px;font-size:11.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.f2-esec{display:inline-flex;align-items:center;gap:4px}
.f2-esec::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ec,#8b95a1);display:inline-block}
.f2-eflag{color:#b45309}
.f2-more{width:100%;margin-top:8px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--tx2);font-size:12px;font-weight:700;cursor:pointer}
.f2-none{padding:16px 8px;text-align:center;color:var(--mu);font-size:12.5px}
.f2-hop2{margin:0 0 9px;padding:8px 10px;border-radius:6px;background:#fafbfc;border:1px dashed var(--line2)}
.f2-out .f2-hop2{margin:9px 0 0}
.f2-h2lab{font-size:11px;font-weight:700;color:var(--mu);margin-bottom:6px}
.f2-h2chips{display:flex;flex-wrap:wrap;gap:6px}
.f2-h2chip{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--tx);font-size:11.5px;cursor:pointer}
.f2-h2chip small{color:var(--mu);font-size:10.5px}
.f2-empty{text-align:center;padding:80px 16px;color:var(--mu)}
@media(min-width:560px) and (max-width:959px){.f2-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:960px){
  .f2-flow.tri{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(300px,340px) 28px minmax(0,1fr);align-items:start;gap:10px}
  .f2-flow.bi{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);align-items:start;gap:12px}
  .f2-center,.f2-in,.f2-out{order:0}
  .f2-conn{display:flex;align-items:center;justify-content:center;padding-top:44px}
  .f2-carr{transform:rotate(-90deg)}
}

<script>
// SW 등록 + 새 워커가 인계하면 1회 자동 새로고침(옛 HTML/JS 혼합 방지, 11/23)
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
  var cgReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(cgReloaded)return; cgReloaded=true;
    try{sessionStorage.setItem('cg_sw_reload','1');}catch(e){}
    location.reload();
  });
}
</script>
