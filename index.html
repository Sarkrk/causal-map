<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e"><title>인과 지도</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="인과 지도">
<style>
:root{--bg:#1e1e1e;--panel:#262626;--line:#3a3a3a;--tx:#dcddde;--mu:#8a8a8a;--acc:#a882ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"Pretendard","Noto Sans KR",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;display:block}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;display:flex;gap:8px;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
#sw{flex:1;position:relative}
#q{width:100%;height:42px;border-radius:21px;border:1px solid var(--line);background:rgba(38,38,38,.92);color:var(--tx);padding:0 16px 0 38px;font-size:16px;outline:none;backdrop-filter:blur(8px)}
#sw::before{content:"⌕";position:absolute;left:14px;top:9px;color:var(--mu);font-size:19px}
#sug{position:absolute;left:0;right:0;top:46px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none;max-height:50vh;overflow-y:auto}
#sug div{padding:12px 14px;border-bottom:1px solid #303030;font-size:15px}
#sug div:active{background:#333}
.fab{width:42px;height:42px;border-radius:21px;border:1px solid var(--line);background:rgba(38,38,38,.92);color:var(--tx);font-size:18px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
#zoombox{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:8px;z-index:4;transition:bottom .25s}
#stat{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);font-size:11px;color:var(--mu);z-index:4;pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);
 box-shadow:0 -8px 30px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .25s ease;max-height:78vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.peek{transform:translateY(calc(100% - 132px - env(safe-area-inset-bottom)))}
.sheet.open{transform:translateY(0)}
.sheet.half{transform:translateY(calc(100% - 50vh))}
#ns{height:78vh}
.fl{overflow-x:auto;margin:4px -6px 0;padding-bottom:6px}.fl svg{display:block}.fl g.bx{cursor:pointer}
.flh{font-size:11px;color:var(--mu);display:flex;justify-content:space-between;padding:0 4px;margin-top:6px}
.hd{padding:8px 16px 4px;touch-action:none;cursor:grab}
.hd i{display:block;width:38px;height:5px;border-radius:3px;background:#555;margin:0 auto 8px}
.bd{overflow-y:auto;padding:0 16px 18px;-webkit-overflow-scrolling:touch}
h2{margin:0;font-size:19px;display:flex;align-items:center;gap:8px}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.sub{color:var(--mu);font-size:13px;margin-top:3px}
.tabs{display:flex;gap:5px;margin:12px 0 6px}.tabs button{white-space:nowrap;padding:7px 10px}.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button,.chip{border:1px solid var(--line);background:#2e2e2e;color:var(--tx);border-radius:16px;padding:7px 12px;font-size:13px}
.tabs button.on,.chip.on{background:var(--tx);color:#1e1e1e;border-color:var(--tx);font-weight:600}
.it{padding:11px 2px;border-bottom:1px solid #313131}
.it .r1{display:flex;align-items:center;gap:8px;font-size:15px}
.g{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;flex:none}
.sg{font-weight:700;width:14px;text-align:center;flex:none}
.nm{flex:1;color:var(--tx);text-decoration:none}
.go{color:var(--acc);font-size:13px;flex:none;padding:4px}
.meta{font-size:12px;color:var(--mu);margin-top:3px;padding-left:22px}
.note{font-size:13px;color:#b8b8b8;margin-top:6px;padding-left:22px;display:none;line-height:1.5}
.it.x .note{display:block}
.sec{font-size:12px;color:var(--mu);margin:16px 0 6px;letter-spacing:.03em}
.row{display:flex;flex-wrap:wrap;gap:6px}
input[type=range]{width:100%;accent-color:var(--acc)}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mu)}
.lg span{display:flex;align-items:center;gap:5px}
.sw{display:inline-block;width:22px;height:0;border-top:2px solid}
</style></head><body>
<canvas id="cv"></canvas>
<div id="top"><div id="sw"><input id="q" type="search" placeholder="노드 검색" autocomplete="off"><div id="sug"></div></div><button class="fab" id="fb" aria-label="필터">☰</button></div>
<div id="zoombox"><button class="fab" id="zi">+</button><button class="fab" id="zo">−</button><button class="fab" id="zf" title="전체 보기">⤢</button></div>
<div id="stat"></div>
<div class="sheet" id="ns"><div class="hd" id="nsh"><i></i><h2 id="nt"></h2><div class="sub" id="nsub"></div></div><div class="bd" id="nb"></div></div>
<div class="sheet" id="fs"><div class="hd" id="fsh"><i></i><h2>보기 설정</h2></div><div class="bd" id="fbd">
 <div class="sec">데이터</div><div id="dver" class="sub" style="line-height:1.6"></div>
 <div class="row" style="margin-top:8px"><button class="chip" id="dupd">⟳ 최신 데이터 받기</button></div><div id="dmsg" class="sub" style="margin-top:6px"></div>
 <div class="sec">등급</div><div class="row" id="flv"></div>
 <div class="lg" style="margin-top:8px"><span><i class="sw" style="border-color:#e5484d"></i>A 확실</span><span><i class="sw" style="border-color:#5b8def"></i>B 유력</span><span><i class="sw" style="border-color:#777"></i>C 후보</span><span><i class="sw" style="border-color:#999;border-top-style:dashed"></i>D 논쟁</span><span><i class="sw" style="border-color:#3fb6c9;border-top-style:dotted"></i>상관(인과 아님)</span></div>
 <div class="sec">범주</div><div class="row" id="fcat"></div>
 <div class="sec">최소 상관 |r| <b id="thrv">0.00</b></div><input id="thr" type="range" min="0" max="0.6" step="0.05" value="0">
 <div class="row" style="margin-top:8px"><button class="chip on" id="tnr">상관값 없는 연결 포함</button></div>
 <div class="sec">표시</div><div class="row"><button class="chip" id="tcor">상관선(점선)</button><button class="chip" id="tlab">라벨 항상</button><button class="chip on" id="torp">고립 노드 숨김</button><button class="chip on" id="tspin">자동 회전</button><button class="chip on" id="twob">흔들림</button><button class="chip" id="trel">다시 배치</button></div>
 <p class="sub" style="margin-top:16px;line-height:1.5">배경 스와이프: 3D 회전(튕기면 관성) · 두 손가락: 확대·이동 · 점 탭: 관련 노드만 강조 + 상세 · 점 끌기: 위치 이동 · 빈 곳 탭: 해제 · 가만히 두면 천천히 회전</p>
</div></div>
<script type="module" src="src/main.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body></html>
